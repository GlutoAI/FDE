# Approved MCP servers. The client launches only these package modules over stdio, and refuses
# to connect unless a server advertises exactly the tools listed here.
[servers.examples]
module = "app.mcp.examples_server"
tools = ["get_example_record"]
init_timeout_seconds = 20
read_timeout_seconds = 10

# Agent roles see only the tools listed for them, per server.
[roles.example_reader]
examples = ["get_example_record"]
